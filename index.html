<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pós-vendas | Procedimentos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <strong>PÓS-VENDAS</strong>
          <small>Processos e procedimentos</small>
        </div>
      </div>

      <div class="search-area">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input id="search" type="search"
                 placeholder="Buscar procedimento, sigla, sistema, responsável..."
                 autocomplete="off">
          <button id="clearSearch" type="button" aria-label="Limpar pesquisa">×</button>
        </div>
        <span id="searchCount"></span>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">Índice & filtros</div>

        <section class="side-section">
          <h3>Filtrar por responsável</h3>
          <div id="responsibleFilters" class="chips"></div>
        </section>

        <section class="side-section">
          <h3>Índice</h3>
          <nav id="toc" class="toc"></nav>
        </section>
      </aside>

      <main id="main" class="content"></main>
    </div>

    <div id="noResults" class="no-results hidden">
      Nada encontrado para <strong id="noResultsTerm"></strong>.
      <br>Tente outro termo ou limpe os filtros.
    </div>
  </div>

  <script src="js/pos-vendas.js"></script>
</body>
</html>
